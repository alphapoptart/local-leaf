<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Every live deal at nearby dispensaries - real menu prices, offers, and product photos in one easy-to-see feed."
    />
    <meta name="theme-color" content="#24684e" />
    <link rel="icon" type="image/svg+xml" href="/local-leaf/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/local-leaf/favicon-32.png" />
    <!-- A real PNG. iOS ignores an SVG apple-touch-icon and then falls back to
         /apple-touch-icon.png at the ROOT of the host, which on GitHub Pages is
         the account's user site - i.e. someone else's icon on the homescreen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/local-leaf/apple-touch-icon.png" />
    <!-- "id" pins the installed app's identity. Without it the browser derives
         the id from start_url, so a copy installed while start_url was still
         "/" was the SAME app as the account's root site - which is why the
         homescreen icon kept opening that one instead. ?v=2 busts the manifest
         cached by anything that installed the old (root-scoped) one. -->
    <link rel="manifest" href="/local-leaf/manifest.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="local leaf" />
    <title>local leaf | Live local cannabis deals</title>
    <script type="module" crossorigin src="/local-leaf/assets/index-BvEfYceZ.js"></script>
    <link rel="stylesheet" crossorigin href="/local-leaf/assets/index-B3lBgt96.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
